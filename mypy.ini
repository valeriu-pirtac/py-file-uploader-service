[mypy]
# Strict type checking configuration
strict = True
python_version = 3.13
namespace_packages = True
exclude = (?x)(^\.venv/|^\.mypy_cache/|^\.ruff_cache/|^\.pytest_cache/|^htmlcov/|^dist/|^build/)
ignore_missing_imports = False

[mypy-tests.*]
ignore_errors = False

[mypy-src.infrastructure.*]
ignore_errors = False

[mypy-src.presentation.*]
allow_untyped_defs = False
disallow_untyped_calls = True
