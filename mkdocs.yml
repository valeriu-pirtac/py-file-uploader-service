site_name: File Uploader Service
site_description: File Uploader Service
site_author: Valeriu Pirtac
repo_url: https://github.com/valeriu-pirtac/py-file-uploader-service
repo_name: py-file-uploader-service

theme:
    name: material
    palette:
        - scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.annotate
        - content.code.copy

nav:
    - Home: index.md
    # - Architecture:
    #       - Overview: architecture/overview.md
    #       - Layers: architecture/layers.md
    # - Development:
    #       - Getting Started: development/getting-started.md
    #       - Configuration: development/configuration.md
    #       - Testing: development/testing.md
    # - API Reference:
    #       - Endpoints: api/endpoints.md

markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - admonition
    - pymdownx.details
    - attr_list
    - md_in_html

plugins:
    - search
