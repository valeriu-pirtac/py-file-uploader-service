name: CI

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]

jobs:
    quality:
        name: Code Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"
            - name: Install dependencies
              run: uv sync --all-groups
            - name: Check formatting
              run: uv run ruff format --check src tests
            - name: Lint
              run: uv run ruff check src tests
            - name: Type check
              run: uv run mypy src

    test:
        name: Tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "latest"
            - name: Install dependencies
              run: uv sync --all-groups
            - name: Run tests with coverage
              run: uv run pytest tests --cov=src --cov-config=pytest.ini --cov-report=xml --cov-report=term-missing
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: htmlcov/
