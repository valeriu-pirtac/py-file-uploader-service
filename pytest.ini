[pytest]
# Pytest configuration
minversion = 7.0
pythonpath = src
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests (domain + application layer, no external services)
    integration: Integration tests (real external service connections)
    e2e: End-to-end tests (full API flow with TestClient)
    asyncio: Marks tests as async
    slow: Marks tests as slow (deselect with -m "not slow")

[coverage:run]
source = src
omit =
    */tests/*
    */__init__.py
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @(abc\.)?abstractmethod
skip_covered = False
precision = 2

[coverage:html]
directory = htmlcov
